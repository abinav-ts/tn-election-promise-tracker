# Source adapters (spec 01 §2.3). Only ept.config reads this file.

# Crawl order (D-031): live sources first, slow Wayback-only sources last.
# tn_policy_notes must come before tnbudget_speeches (S3 skips speeches S1 already lists).
order: [tn_policy_notes, tn_gos, tn_schemes, manual, tnbudget_speeches, governor_addresses, cag_reports]

# Canonical department names keyed by the tn.gov.in dep_id (the same ids are used by the
# policy-note and GO listings). Names as listed on 2026-10-07.
departments:
  "1": "Social Justice Department"
  "2": "Agriculture - Farmers Welfare Department"
  "3": "Animal Husbandry, Dairying, Fisheries and Fishermen Welfare Department"
  "4": "BC, MBC & Minorities Welfare Department"
  "5": "Co-operation, Food and Consumer Protection Department"
  "6": "Commercial Taxes and Registration Department"
  "7": "Energy Department"
  "8": "Environment, Climate Change and Forests Department"
  "9": "Finance Department"
  "10": "Handlooms, Handicrafts, Textiles and Khadi Department"
  "11": "Health and Family Welfare Department"
  "12": "Higher Education Department"
  "13": "Highways and Minor Ports Department"
  "14": "Home, Prohibition and Excise Department"
  "15": "Housing and Urban Development Department"
  "16": "Industries, Investment Promotion & Commerce Department"
  "17": "Artificial Intelligence, Information Technology and Digital Services Department"
  "18": "Labour Welfare and Skill Development Department"
  "19": "Law Department"
  "21": "Municipal Administration and Water Supply Department"
  "22": "Human Resources Management Department"
  "23": "Planning and Development Department"
  "24": "Public Department"
  "26": "Revenue and Disaster Management Department"
  "27": "Rural Development and Panchayat Raj Department"
  "28": "School Education Department"
  "29": "Micro, Small and Medium Enterprises Department"
  "30": "Social Welfare and Women Empowerment Department"
  "31": "Tamil Dev. and Information Department"
  "32": "Tourism, Culture and Special Initiatives Department"
  "33": "Transport Department"
  "34": "Youth Welfare and Sports Development Department"
  "35": "Welfare of Differently Abled Persons"
  "38": "Public (Elections) Department"
  "41": "Special Programme Implementation"
  "42": "Public Works Department"
  "44": "Water Resources Department"
  "45": "Natural Resources Department"

sources:
  tn_policy_notes:
    doc_type: policy_note
    base_url: https://www.tn.gov.in/
    dept_list_url: https://www.tn.gov.in/document_dept_list.php?cate_name=YWxs
    dept_page: "document.php?dep_id={dep_id_b64}&year={fy_b64}&cate_name=YWxs"
    wayback_prefixes: ["cms.tn.gov.in/cms_migrated/document/docfiles/", "cms.tn.gov.in/sites/default/files/documents/"]
    # Pre-migration location of the same files. Only captures whose digest equals the kept
    # bytes are used for dating (D-018), so an alias can never date a different version.
    wayback_legacy:
      "cms.tn.gov.in/cms_migrated/document/docfiles/": ["cms.tn.gov.in/sites/default/files/documents/"]
    wayback_legacy_suffixes: ["", "_0", "_1"]

  tnbudget_speeches:
    doc_type: budget_speech
    cdx_prefix: "tnbudget.tn.gov.in/tnweb_files/"
    wayback_prefixes: ["tnbudget.tn.gov.in/tnweb_files/"]
    dep_id: 9                     # Finance Department
    skip_if_covered_by: tn_policy_notes   # D-025: S3 only fills gaps

  governor_addresses:
    doc_type: governor_address

  cag_reports:
    doc_type: cag_report
    cdx_prefix: "cag.gov.in/uploads/download_audit_report/"
    cdx_filters: ["original:.*[Tt]amil.*"]   # file names mention the state as "Tamil"/"Tamil_Nadu"

  tn_schemes:
    doc_type: scheme_page
    base_url: https://www.tn.gov.in/
    list_url: schemes.php
    dept_param: dep_id
    archived_prefix: "tn.gov.in/scheme/data_view/"
    wayback_prefixes: ["tn.gov.in/scheme/data_view/"]
    # main content: current portal's detail table, else the previous portal's content region
    html_main: "table.ng-table, .region-content"
    html_rows: "tr, .node_viewlist_even, .node_viewlist_odd"
    # Pages are snapshots: dates in the text (GO dates, "Introduced On") describe the scheme,
    # not the page, so only a Wayback capture may date them (spec 01 §2.3).
    text_dating: false

  tn_gos:
    doc_type: go
    base_url: https://www.tn.gov.in/
    dept_page: "go.php?dep_id={dep_id_b64}&year={year_b64}"
    wayback_prefixes: ["cms.tn.gov.in/cms_migrated/document/GO/"]

  manual:
    doc_type: null

# Third-party promise trackers: leads only, never evidence (D-020). Found 2026-10-11 by web search.
# DMK-2021 has four, AIADMK-2016 two (coverage asymmetry, OQ-3). None cites GO numbers.
