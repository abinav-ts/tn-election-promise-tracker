  - name: Pudhiyavan DMK manifesto 2021 tracker
    url: https://dmk-manifesto-2021-tracker.pudhiyavan.com/
    term_id: DMK-2021
  - name: RG Anand, DMK manifesto tracker (PDF)
    url: https://rganand.com/images/publications/DMK_manifesto_tracker.pdf
    term_id: DMK-2021
    ext: .pdf
  - name: OnlyVotez DMK promise tracker (data bundle of the web app)
    url: https://onlyvotez.byvignesh.com/assets/index-CQsFjt6x.js
    term_id: DMK-2021
    ext: .js
  - name: TNM status check, AIADMK 2016 water and infrastructure promises
    url: https://www.thenewsminute.com/article/tnm-status-check-aiadmk-s-2016-promises-water-and-infrastructure-145089
    term_id: AIADMK-2016
  - name: TNM, AIADMK 2016 social welfare promises
    url: https://www.thenewsminute.com/article/amma-housing-scheme-free-washing-machine-aiadmk-s-social-welfare-promises-145231
    term_id: AIADMK-2016
