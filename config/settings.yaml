# Project settings. All configurable values live here (global spec §9.4).
# Only ept.config reads this file.

paths:
  db: data/ept.sqlite
  raw_evidence: data/raw/evidence
  manual_dir: data/raw/evidence/_manual
  manual_manifest: data/raw/evidence/_manual/manual_manifest.csv
  trackers_raw: data/raw/trackers
  catalogue_dir: data/interim/catalogue
  text_dir: data/interim/text
  lang_pairs: data/interim/lang_pairs.csv
  tracker_leads: data/interim/tracker_leads.csv
  date_review: data/interim/date_review.csv
  quarantine: data/raw/evidence/_quarantine
  spotcheck: data/interim/spotcheck_{stage}.csv   # template; stage 01 keeps spotcheck_01.csv
  runs: reports/runs
  coverage_md: reports/coverage_01.md
  coverage_json: reports/coverage_01.json
  prompts: prompts
  llm_cache: cache/llm
  llm_usage_log: reports/llm_usage.jsonl
  llm_fixtures: tests/fixtures/llm
  http_cache: cache/http
  # stage 02 (spec 02 §4.10)
  manifestos_raw: data/raw/manifestos
  manifesto_profiles: config/manifestos.yaml
  manifesto_interim: data/interim/manifestos
  frozen: data/frozen
  promise_overrides: config/promise_overrides.csv
  extract_dropped: data/interim/extract_dropped_02.csv
  extract_failures: data/interim/extract_failures_02.csv
  promise_dedup: data/interim/promise_dedup.csv
  extraction_md: reports/extraction_02.md
  extraction_json: reports/extraction_02.json
  backend_test_md: reports/backend_test_02.md
  # stage 03 (spec 03 §4.9)
  classify_overrides: config/classify_overrides.csv
  classify_failures: data/interim/classify_failures_03.csv
  classify_interim: data/interim/classify          # per-term results with audit fields, before freezing
  classification_md: reports/classification_03.md
  classification_json: reports/classification_03.json
  classification_frozen: data/frozen/classification_{term}.jsonl   # template (D-064)
  # stage 04 (spec 04 §4.11)
  embeddings_dir: data/processed/embeddings
  bm25_tokens: data/processed/bm25_tokens.jsonl.gz
  retrieval_md: reports/retrieval_04.md
  retrieval_json: reports/retrieval_04.json
  spotcheck_04_dir: data/interim/spotcheck_04
  retrieve_diag: data/interim/retrieve_diag_04/{run_id}.jsonl   # per indicator x cutoff diagnostics (report, spot-check)

# Spec 01 §2.1 (D-016). term_end = day before the next swearing-in.
terms:
  - term_id: AIADMK-2016
    party: AIADMK
    manifesto_year: 2016
    sworn_in: 2016-05-23
    term_end: 2021-05-06
    role: backtest
  - term_id: DMK-2021
    party: DMK
    manifesto_year: 2021
    sworn_in: 2021-05-07
    term_end: 2026-05-09
    role: train
  - term_id: TVK-2026
    party: TVK
    manifesto_year: 2026
    sworn_in: 2026-05-10
    term_end: null
    role: project

# Spec 01 §2.2. end: null = run date.
evidence_window:
  start: 2016-05-01
  end: null

http:
  user_agent: "EPT-research-crawler/0.1 (Tamil Nadu election promise tracker, student course project; contact: 166200422+abinav-ts@users.noreply.github.com)"
  timeout_s: 60
  retries: 3
  backoff_s: 2.0
  rate_per_host: 1.0          # requests per second, default for every host
  obey_robots: true
  host_failures_to_trip: 3    # consecutive failed requests before a host is paused
  host_cooldown_s: 120        # first pause; doubles on each re-trip
  host_max_cooldown_s: 1800
  max_download_s: 600         # wall-clock limit for one file download (streamed); over it = retryable failure
  chunk_bytes: 65536
  listing_cache_ttl_days: 7   # listing HTML in cache/http is reused for this long

wayback:
  host: web.archive.org
  cdx_url: https://web.archive.org/cdx/search/cdx
  raw_template: "https://web.archive.org/web/{ts}id_/{url}"
  rate: 0.5                   # requests per second
  max_versions_tried: 3       # newest distinct digests tried when the latest capture is incomplete (D-030)

parse:
  ocr_min_chars_per_page: 200
  ocr_lang: eng
  ocr_dpi: 300
  ocr_timeout_s: 120
  front_matter_pages: 2       # pages searched for the issue date (spec 01 §4.5 rank 3)

lang:
  tamil_ratio: 0.30           # share of letters in the Tamil Unicode block
  legacy_garbage_ratio: 0.25  # share of Latin-1 symbol/accented chars that marks legacy-font Tamil

chunk:
  target_words: 400
  min_words: 300
  max_words: 500

date:
  conflict_days: 7
  fy_slack_months: 3
  fy_bound:                   # spec 04 §4.2 (D-077): available_by capped at the fiscal-year end
    doc_types: [policy_note, budget_speech]
    title_prefixes: {other: ["Performance Budget"]}

tamil:
  include_in_evidence: false

coverage:
  hole_fraction: 0.25         # a GO department-year below this share of the department's median is a hole

progress:
  every_items: 25             # crawl/parse print a progress line every N documents
  every_catalogued: 500       # ... and every N catalogue items while reading listings

spotcheck:                    # global spec §12.4 (D-027)
  min_items: 7
  max_items: 10
  per_source: 3

go:
  download_mode: all          # D-021: all English GOs in the window

# Spec 02 §4.10; starting values from spec 02 §9 OQ-1 (revisable with a logged reason).
extract:
  ocr_lang: tam
  ocr_psm: 3                  # Tesseract page segmentation mode (3 = fully automatic)
  ocr_timeout_s: 180
  overprint_px: 1.0           # font_map: same glyph within this distance = fake-bold copy
  line_tol_px: 2.0            # font_map: baselines within this distance form one line
  space_gap_px: 1.5           # font_map: a wider gap between glyphs (no space glyph) becomes a space
  fontmap_min_tamil_share: 0.98
  min_validity: 0.98
  calibration_pages: 5
  calibration_ppi: 150        # TVK's scan resolution
  ocr_gate:
    max_cer: 0.02             # D-048 (was 0.05): calibration is optimistic; passing TVK pages still had visible errors
    min_conf: 80
  vision_disagree_cer: 0.25
  vision:
    max_attempts: 2
    max_unreadable: 5         # most "[?]" marks a valid transcription may contain
  transcribe_batch: 10        # Cowork fallback only
  indent_tol_px: 3.0          # cutter: a line within this distance of a profile x position is "at" it
  max_number_jump: 3          # running/section numbers: a jump larger than this is not an item marker (D-045)
  backend_test:                # spec 02 §4.8 sample (D-053: 10 DMK + 10 AIADMK)
    seed: 20261013
    per_term: {DMK-2021: 10, AIADMK-2016: 10}
  spotcheck:                   # D-054: with TVK deferred only 2 terms, so 3 per term would cap the sheet at 6
    per_term: 5
    per_term_group: 3
  units_per_call: 25          # D-050 (was 8): free-tier quota of ~20 requests/day per model
  max_promises_per_unit: 5
  max_text_words: 60
  common_words: [Union, Government, Central, State, States, India, Indian, Tamil, Nadu, Rs, Rupees, Crore,
                 Lakh, Lakhs, Act, Constitution, Assembly, Parliament, District, Districts, Department, Scheme,
                 English, Hindi, Chief, Minister, Ministry, Board, Corporation, Council, Committee, Commission,
                 Court, High, Supreme, National, Policy, January, February, March, April, May, June, July,
                 August, September, October, November, December]
  dedup:
    candidate_ratio: 0.80
    pairs_per_call: 20          # D-050: candidate pairs batched into one call
  frozen_terms: [AIADMK-2016, DMK-2021, TVK-2026]

# Spec 03 §4.9; starting values accepted (OQ-4), revisable after the limit-20 run with a logged reason.
classify:
  promises_per_call: 20       # a batch never splits a unit, so it may run over by one unit
  headline_cap: 25            # per term (D-068)
  min_indicators: 2           # vague promises (D-006)
  max_indicators: 4
  min_queries: 2              # per indicator
  max_queries: 4
  min_query_words: 2
  max_query_words: 12
  max_indicator_words: 40
  extra_common_words: [MW, LPG]   # added to extract.common_words for check C3 (D-073: generic units, not names)
  vague_stop_share: 0.5       # D-070: a term above this stops the run for the user's decision
  goal_verbs: [improve, strengthen, promote, ensure]   # spot-check group e (specific promise with a goal verb)
  spotcheck:
    per_term: 3
    per_group: 3
  frozen_terms: [AIADMK-2016, DMK-2021, TVK-2026]            # D-064: classification snapshots in data/frozen/classification_{term}.jsonl

# Spec 04 §4.11 (D-075–D-079).
retrieve:
  landmarks_months: {AIADMK-2016: [5, 6, 12, 24, 36, 48], DMK-2021: [5, 6, 12, 24, 36, 48], TVK-2026: [5]}
  full_term: true             # for every term with a term_end (D-075)
  k: 5                        # chunks per indicator x cutoff, both judges (D-078, Q-06)
  max_per_doc: 2
  go_min: 2                   # GO places (D-078)
  go_pool: 50
  bm25: {k1: 1.5, b: 0.75, epsilon: 0.25, depth: 100}
  dense:
    model: BAAI/bge-small-en-v1.5   # D-079; MIT licence (THIRD_PARTY_NOTICES.md)
    revision: null            # pinned to the commit hash at first download
    max_seq_length: 512
    batch_size: 64
    depth: 100
    device: auto              # MPS if available, else CPU
    query_instruction: "Represent this sentence for searching relevant passages: "
    mock: false               # tests: deterministic hashing embedder (or EPT_EMBED_MOCK=1)
    mock_dim: 64
  rrf: {k: 60, w_bm25: 1.0, w_dense: 1.0}
  index_shard: 2000
  tokens_per_word: 1.33       # report: stage 05 sizing (English prose, approximate)
  spotcheck: {per_term: 3, per_group: 3, snippet_words: 150, near_cutoff_days: 31}

llm:
  retries: 1                  # one retry on schema-validation failure (global §6.1)
  temperature: 0
  models:
    bulk: gemini-3.5-flash-lite                # set by `ept extract backend-test` (spec 02 §4.8)
    vision: gemini-3.8-flash  # manifesto page transcription, fixed in advance (D-044)
    strong: claude-cowork
    mock: mock
  bulk:                       # Gemini API free tier (D-037)
    api_key_env: GEMINI_API_KEY
    candidates: [gemini-3.8-flash, gemini-3.5-flash-lite]
    rpm: 14                   # bulk model gemini-3.5-flash-lite allows 15 rpm (AI Studio); one below for safety
    rpd:                      # requests per day, per model (free tier; D-050)
      gemini-3.8-flash: 20    # observed 2026-10-13: the 21st request of the day got a per-day 429
      gemini-3.5-flash-lite: 500    # AI Studio free tier: 15 rpm / 500 rpd (user, 2026-10-13; first read as 50)
    quota_tz: America/Los_Angeles   # Gemini daily quotas reset at midnight Pacific
    min_v1_pass: 0.90
    backoff_s: 5
    max_backoff_s: 120
    timeout_s: 300            # one request (image pages included)
