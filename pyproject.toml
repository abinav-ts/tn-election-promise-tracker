[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ept"
version = "0.1.0"
description = "Tamil Nadu election promise tracker"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.5",
    "pyyaml>=6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ept = "ept.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
